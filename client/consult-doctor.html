<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Consult a Doctor — KnowYourHair</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="site-header"><div id="site-header" data-active="consult-doctor"></div></header>

<main>
  <div class="page-hero">
    <p class="eyebrow">Consult a doctor</p>
    <h1>Talk to a dermatologist</h1>
    <p class="lede">Some scalp and hair concerns need a professional, not a routine.
      Choose a doctor below and request an appointment — you'll need to be logged in to book.</p>
  </div>

  <section class="section">
    <div class="grid-2" id="doctor-list"><!-- filled by consult-doctor.js --></div>
  </section>
</main>

<div class="modal-overlay" id="booking-modal">
  <div class="modal">
    <button class="modal-close" id="booking-close">✕</button>
    <p class="eyebrow" id="booking-doctor-specialty"></p>
    <h2 id="booking-doctor-name"></h2>
    <form id="booking-form">
      <div class="field">
        <label for="booking-date">Preferred date</label>
        <input type="date" id="booking-date" required />
      </div>
      <div class="field">
        <label for="booking-email">Your contact email</label>
        <input type="email" id="booking-email" required />
      </div>
      <div class="field">
        <label for="booking-reason">What's going on? (optional)</label>
        <textarea id="booking-reason" rows="3" placeholder="Briefly describe your concern"></textarea>
      </div>
      <div class="form-error" id="booking-error"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Request appointment</button>
    </form>
    <p class="form-note" id="booking-success" style="display:none;color:var(--moss)">Request sent — the office will follow up by email to confirm.</p>
  </div>
</div>

<footer class="site-footer"><div id="site-footer"></div></footer>

<script src="/js/api.js"></script>
<script src="/js/main.js"></script>
<script src="/js/consult-doctor.js"></script>
</body>
</html>
